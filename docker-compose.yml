services:
  postgres:
    image: postgres:16
    container_name: eatgood_postgres
    environment:
      POSTGRES_DB: eatgood
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: